<svg xmlns="http://www.w3.org/2000/svg" width="582" height="164" viewBox="0 0 582 164">
  <!-- ⚡ Bolt Optimization: Deduplicated massive ASCII text block into <defs> for smaller file size -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/><stop offset="0.5" stop-color="#7c6cff"/><stop offset="1" stop-color="#ff5ea8"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="18" y="0" height="164" width="0">
        <animate attributeName="width" values="0;550;550;550;0" keyTimes="0;0.45;0.88;0.97;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <filter id="nglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>

    <g id="name-ascii"><text x="20" y="36" textLength="542" lengthAdjust="spacingAndGlyphs" xml:space="preserve">          _     _     _                                      _____       _ </text>
<text x="20" y="49" textLength="542" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    /\   | |   | |   (_)                                    |  __ \     (_)</text>
<text x="20" y="62" textLength="542" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   /  \  | |__ | |__  _ _ __ ___   __ _ _ __  _   _ _   _   | |__) |__ _ _ </text>
<text x="20" y="75" textLength="542" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  / /\ \ | '_ \| '_ \| | '_ ` _ \ / _` | '_ \| | | | | | |  |  _  // _` | |</text>
<text x="20" y="88" textLength="542" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> / ____ \| |_) | | | | | | | | | | (_| | | | | |_| | |_| |  | | \ \ (_| | |</text>
<text x="20" y="101" textLength="542" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/_/    \_\_.__/|_| |_|_|_| |_| |_|\__,_|_| |_|\__, |\__,_|  |_|  \_\__,_| |</text>
<text x="20" y="114" textLength="542" lengthAdjust="spacingAndGlyphs" xml:space="preserve">                                               __/ |                   _/ |</text>
<text x="20" y="127" textLength="542" lengthAdjust="spacingAndGlyphs" xml:space="preserve">                                              |___/                   |__/ </text></g>
  </defs>
  <rect width="100%" height="100%" rx="12" fill="#0d1117"/>
  <g font-family="'Courier New',Courier,monospace" font-size="12" font-weight="bold">
    <g fill="#2a3644"><use href="#name-ascii"/></g>
    <g>
      <animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.45;0.88;0.97;1" dur="7s" repeatCount="indefinite"/>
      <g clip-path="url(#reveal)">
        <g fill="url(#base)" filter="url(#nglow)" opacity="0.85"><use href="#name-ascii"/></g>
        <g fill="url(#base)"><use href="#name-ascii"/></g>
      </g>
      <rect y="22" width="3.5" height="112" rx="1.5" fill="#00e5ff">
        <animate attributeName="x" values="18;566;566;566;18" keyTimes="0;0.45;0.88;0.97;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.15;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>